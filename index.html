<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arshya Modern</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0e14 0%, #121824 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(212, 175, 55, 0.25);
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            padding: 15px 10px;
            background: rgba(10, 14, 20, 0.8);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            width: 60px;
            height: auto;
            border-radius: 8px;
            background: #fff;
            padding: 3px;
            margin-bottom: 5px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { padding: 12px; }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            color: var(--text-main);
        }

        .cat-chip.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: bold;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
        }

        .qty-btn {
            background: var(--card-border);
            color: #fff; border: none;
            width: 30px; height: 30px;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn-submit {
            width: 100%;
            background: var(--gold-gradient);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>ARSHYA MODERN</h1>
        <p style="font-size: 11px; color: var(--text-muted);">Bosh Sahifa — Tikuvchilik Furnituralari</p>
    </div>

    <div class="container">
        <!-- Kategoriyalar -->
        <div class="categories">
            <div class="cat-chip active">Barchasi</div>
            <div class="cat-chip">Zardo'zlik</div>
            <div class="cat-chip">Iplar</div>
            <div class="cat-chip">Tugmalar</div>
            <div class="cat-chip">Tasht/Qaychilar</div>
        </div>

        <h3 style="font-size: 14px; margin-bottom: 10px; color: var(--gold-primary);">
            <i class="fa-solid fa-fire"></i> MASHHUR MAHSULOTLAR
        </h3>

        <div class="product-grid">
            <!-- Tovar 1 -->
            <div class="product-card">
                <h4 style="font-size: 15px;">Zardo'zlik Ip (Oltin rang)</h4>
                <p style="font-size: 11px; color: var(--text-muted); margin: 4px 0;">Dona narxi: 45,000 so'm (10+ dona: 40,000 so'm)</p>

                <div style="display: flex; align-items: center; gap: 10px; margin: 10px 0;">
                    <span style="font-size: 12px;">Soni:</span>
                    <button class="qty-btn" onclick="changeQty(-1)">-</button>
                    <span id="qty-val" style="font-weight: bold;">1</span>
                    <button class="qty-btn" style="background: var(--gold-primary); color: #000;" onclick="changeQty(1)">+</button>
                </div>

                <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px;">
                    Jami: <span id="total-val" style="color: var(--gold-primary);">45,000</span> so'm
                </div>

                <button class="btn-submit" onclick="sendOrder()">To'lovni tasdiqlashga yuborish</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let unitPrice = 45000;
        let qty = 1;

        function changeQty(delta) {
            qty += delta;
            if (qty < 1) qty = 1;

            unitPrice = (qty >= 10) ? 40000 : 45000;
            const total = qty * unitPrice;

            document.getElementById('qty-val').innerText = qty;
            document.getElementById('total-val').innerText = total.toLocaleString();
        }

        function sendOrder() {
            const total = qty * unitPrice;
            const payload = {
                action: "buyurtma",
                item: "Zardo'zlik Ip (Oltin rang)",
                qty: qty,
                total: total
            };

            tg.sendData(JSON.stringify(payload));
            tg.close();
        }
    </script>
</body>
</html>
