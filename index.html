<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arshya Modern</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0e14 0%, #121824 100%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(212, 175, 55, 0.25);
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 20px 15px 10px;
            background: rgba(10, 14, 20, 0.7);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            width: 75px;
            height: auto;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
            border-radius: 8px;
            background: #ffffff;
            padding: 4px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .header p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .container { padding: 0 14px; }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Search Bar with Camera */
        .search-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 8px 14px;
            margin-bottom: 15px;
            gap: 10px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 13px;
        }

        .search-box i {
            color: var(--gold-primary);
            font-size: 16px;
            cursor: pointer;
        }

        /* Product Card */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }

        .qty-btn {
            background: var(--card-border);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: var(--gold-gradient);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Bottom Nav */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10, 14, 20, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
        }

        .nav-item.active { color: var(--gold-primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Arshya Logo" class="brand-logo">
        <h1>ARSHYA MODERN</h1>
        <p>Milliy va Zamonaviy Tikuvchilik Platformasi</p>
    </div>

    <div class="container">

        <!-- TAB: FURNITURA -->
        <div id="tab-furnitura" class="tab-content active">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Furnitura qidirish...">
                <i class="fa-solid fa-camera" title="Rasm orqali qidirish" onclick="alert('Rasm orqali qidiruv tez orada ishga tushadi!')"></i>
            </div>

            <div class="section-title"><i class="fa-solid fa-boxes-stacked"></i> Tovar buyurtma qilish</div>

            <div class="product-card">
                <h3 style="font-size: 15px;">Zardo'zlik Ip (Oltin rang)</h3>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Dona narxi: 45,000 so'm (10 tadan ko'pga 40,000 so'm)</p>

                <div class="qty-control">
                    <span style="font-size: 12px;">Soni:</span>
                    <button class="qty-btn" onclick="changeQty(-1)">-</button>
                    <span id="qty-val" style="font-weight: bold; font-size: 15px;">1</span>
                    <button class="qty-btn" style="background: var(--gold-primary); color: #000;" onclick="changeQty(1)">+</button>
                </div>

                <div style="font-size: 14px; font-weight: bold; margin-bottom: 12px;">
                    Jami summa: <span id="total-val" style="color: var(--gold-primary);">45,000</span> so'm
                </div>

                <div style="margin-bottom: 10px;">
                    <label style="font-size: 11px; color: var(--gold-primary); display: block; margin-bottom: 5px;">To'lov cheki rasmini biriktiring:</label>
                    <input type="file" id="receipt-file" accept="image/*" style="width: 100%; font-size: 11px; color: #fff;">
                </div>

                <button class="btn-submit" onclick="sendOrder()">To'lovni tasdiqlashga yuborish</button>
            </div>
        </div>

    </div>

    <!-- Bottom Nav -->
    <div class="nav-bar">
        <div class="nav-item active">
            <i class="fa-solid fa-boxes-stacked"></i>
            <span>Furnitura</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let unitPrice = 45000;
        let qty = 1;

        function changeQty(delta) {
            qty += delta;
            if (qty < 1) qty = 1;

            if (qty >= 10) {
                unitPrice = 40000; // Ulgurji chegirma
            } else {
                unitPrice = 45000;
            }

            const total = qty * unitPrice;
            document.getElementById('qty-val').innerText = qty;
            document.getElementById('total-val').innerText = total.toLocaleString();
        }

        function sendOrder() {
            const receiptInput = document.getElementById('receipt-file');
            if (!receiptInput.files.length) {
                alert("Iltimos, to'lov cheki rasmini biriktiring!");
                return;
            }

            const total = qty * unitPrice;
            tg.sendData(JSON.stringify({
                action: "buyurtma",
                item: "Zardo'zlik Ip (Oltin rang)",
                qty: qty,
                total: total
            }));
        }
    </script>
</body>
</html>
